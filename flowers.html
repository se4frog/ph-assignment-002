<!DOCTYPE html>
<html lang="en">

<head>

    <title>Flower Market</title>
    <link rel="stylesheet" href="styles/flowers.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <header class="header section">
        <nav class="nav-bar">
            <img src="assets/logo.png" alt="" class="logo">
            <div>
                <ul class="nav-links inter-font">
                    <li class="nav-item"><a href="" class="nav-link hide-for-the-good" id="home">Home</a></li>
                    <li class="nav-item"><a href="" class="nav-link text-off-white hide-for-the-good">Shop</a></li>
                    <li class="nav-item"><a href="" class="nav-link text-off-white hide-for-the-good">About Us</a></li>

            <div class="banner-text">

                <P class="banner-details inter-font">Indulge your senses with the beauty and fragrance of our fresh flower shop. From classic roses to exotic blooms, we offer a wide variety of fresh flowers that are perfect for any occasion. </P>
